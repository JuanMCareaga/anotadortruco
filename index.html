<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anotador de Truco 🔥</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="flia.png" />
  </head>
  <body>
    <h1>
      Anotador de Truco <br />
      Familia Reynoso 🔥
    </h1>

    <!-- POPUP -->
    <div id="popup">
      <div id="popup-content">
        <h2>🎉 ¡Tenemos un ganador! 🎉</h2>
        <button onclick="cerrarPopup()">Aceptar</button>
      </div>
    </div>

    <div class="marcador">
      <div class="equipo" id="equipo1">
        <h2>Soles ⭐</h2>
        <div class="fosforos" id="fosforos1"></div>
        <div class="botones">
          <button onclick="sumar('equipo1')">Sumar</button>
          <button onclick="restar('equipo1')">Restar</button>
        </div>
        <div class="puntaje" id="puntaje1">0</div>
      </div>

      <div class="equipo" id="equipo2">
        <h2>Monitos 🐵</h2>
        <div class="fosforos" id="fosforos2"></div>
        <div class="botones">
          <button onclick="sumar('equipo2')">Sumar</button>
          <button onclick="restar('equipo2')">Restar</button>
        </div>
        <div class="puntaje" id="puntaje2">0</div>
      </div>
    </div>

    <button id="reiniciar" onclick="reiniciarJuego()">
      🔄 Reiniciar Juego
    </button>

    <a href="https://youtu.be/nWPaFd_RJlw?si=dRdUP6rIEc-9sGGW" target="_blank">
      <button style="margin-top: 50px; width: 80%; font-weight: 800">
        Reglas UNICAS Y OFICIALES del TRUCO 🐵⭐
      </button>
    </a>

    <audio id="audioVictoria" src="victoria.mp3"></audio>

    <script src="script.js"></script>
  </body>
</html>
