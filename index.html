<!DOCTYPE html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anotador de Truco 🔥</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Anotador de Truco 🔥</h1>

    <div class="marcador">
      <div class="equipo" id="equipo1">
        <h2>Soles ⭐</h2>
        <div class="fosforos" id="fosforos1"></div>
        <button onclick="sumar('equipo1')">Sumar</button>
        <button onclick="restar('equipo1')">Restar</button>
      </div>

      <div class="equipo" id="equipo2">
        <h2>Monitos 🐒</h2>
        <div class="fosforos" id="fosforos2"></div>
        <button onclick="sumar('equipo2')">Sumar</button>
        <button onclick="restar('equipo2')">Restar</button>
      </div>
    </div>

    <audio id="audioVictoria" src="victoria.mp3"></audio>

    <script src="script.js"></script>
  </body>
</html>
